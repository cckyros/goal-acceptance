name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write # GITHUB_TOKEN 发布 GitHub Packages 所需
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # version 必须显式指定:本仓库 package.json 无 packageManager 字段,
      # pnpm/action-setup 缺 version 输入时会直接报错退出。
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # pnpm 11.22 uses node:sqlite (requires >= 22.13)
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify # build → typecheck → node --test (135/135)
      - name: Validate tag vs version
        run: |
          TAG=${GITHUB_REF#refs/tags/}          # v0.2.0
          VER="v$(node -p "require('./package.json').version")"  # package.json 0.2.0 → v0.2.0
          [ "$TAG" = "$VER" ] || { echo "tag $TAG != version $VER"; exit 1; }
      # pnpm v11.5.3+ no longer expands ${...} placeholders in project .npmrc,
      # so we set the scoped registry + auth explicitly via pnpm config for each publish.
      - name: Publish to GitHub Packages
        run: |
          pnpm config set --location project @cckyros:registry https://npm.pkg.github.com
          pnpm config set //npm.pkg.github.com/:_authToken "$GITHUB_TOKEN"
          pnpm publish --no-git-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to npm
        run: |
          pnpm config set --location project @cckyros:registry https://registry.npmjs.org
          pnpm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          pnpm publish --no-git-checks
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
